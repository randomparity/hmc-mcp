[project]
name = "hmc-mcp"
version = "0.1.0"
description = "MCP server and CLI for the IBM HMC (Hardware Management Console) REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.18.0",
    "defusedxml>=0.7.1",
    "fastmcp>=3.4.6",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
hmc-mcp = "hmc_mcp:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]

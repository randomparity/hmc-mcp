[project]
name = "hmc-mcp"
version = "0.1.0"
description = "MCP server and CLI for the IBM HMC (Hardware Management Console) REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncssh==2.24.0",
    "defusedxml==0.7.1",
    "fastmcp-slim[server]==3.4.7",
    "httpx==0.28.1",
    "mcp==1.29.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "rich==15.0.0",
    "typer==0.27.1",
]

[project.scripts]
hmc-mcp = "hmc_mcp:main"

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cryptography==50.0.0",
    "detect-secrets==1.5.0",
    "fastmcp-slim[client]==3.4.7",
    "prek==0.4.10",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.15.22",
    "ty==0.0.62",
    "zizmor==1.29.0",
]

[tool.ty.src]
include = ["src/hmc_mcp"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
# Coverage gate: the CLI command tests keep the package at ~77%; the floor
# makes any regression visible. Run a subset with `--no-cov` to skip the gate.
addopts = "--cov=hmc_mcp --cov-report=term-missing --cov-fail-under=75"

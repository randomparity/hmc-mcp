[project]
name = "hmc-mcp"
version = "0.1.0"
description = "MCP server and CLI for the IBM HMC (Hardware Management Console) REST API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.24.0,<3",
    "defusedxml>=0.7.1,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "typing-extensions>=4.16.0,<5",
]

[project.optional-dependencies]
app = [
    "fastmcp-slim[server]==3.4.7",
    "mcp==1.29.0",
    "rich==15.0.0",
    "typer==0.27.1",
    "uvicorn==0.52.4",
]

[project.urls]
Repository = "https://github.com/randomparity/hmc-mcp"
Contributing = "https://github.com/randomparity/hmc-mcp/blob/main/CONTRIBUTING.md"
Security = "https://github.com/randomparity/hmc-mcp/security/policy"

[project.scripts]
hmc-mcp = "hmc_mcp:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/hmc_mcp",
]

[dependency-groups]
dev = [
    "cryptography==50.0.0",
    "detect-secrets==1.5.0",
    "fastmcp-slim[client]==3.4.7",
    "hatchling==1.32.0",
    "prek==0.4.14",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.16.4",
    "ty==0.0.74",
    "zizmor==1.29.0",
]

[tool.ty.src]
include = ["src/hmc_mcp"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
# Package-wide coverage gate lives in [tool.coverage.report]. Run a focused
# subset with `--no-cov` when package-wide coverage is not meaningful.
addopts = "--cov=hmc_mcp --cov-report="

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90.5
precision = 2

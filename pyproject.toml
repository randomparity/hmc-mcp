[project]
name = "hmc-mcp"
dynamic = ["version"]
description = "MCP server and CLI for the IBM HMC (Hardware Management Console) REST API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "asyncssh==2.24.0",
    "defusedxml==0.7.1",
    "fastmcp-slim[server]==3.4.7",
    "httpx==0.28.1",
    "mcp==1.29.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "rich==15.0.0",
    "typer==0.27.1",
]

[project.urls]
Repository = "https://github.com/randomparity/hmc-mcp"
Contributing = "https://github.com/randomparity/hmc-mcp/blob/main/CONTRIBUTING.md"
Security = "https://github.com/randomparity/hmc-mcp/security/policy"

[project.scripts]
hmc-mcp = "hmc_mcp:main"

[build-system]
requires = ["hatchling==1.32.0", "versioningit==3.3.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "versioningit"

[tool.versioningit.vcs]
method = { module = "versioning", value = "describe_git", module-dir = "scripts" }

[tool.versioningit.next-version]
method = { module = "versioning", value = "next_release", module-dir = "scripts" }
release-line = "minor"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}+{vcs}{rev}"

[dependency-groups]
dev = [
    "cryptography==50.0.0",
    "detect-secrets==1.5.0",
    "fastmcp-slim[client]==3.4.7",
    "hatchling==1.32.0",
    "prek==0.4.10",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.15.22",
    "ty==0.0.62",
    "versioningit==3.3.0",
    "zizmor==1.29.0",
]

[tool.ty.src]
include = ["src/hmc_mcp"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
# Keep the package-wide gate at the rounded full-suite baseline. Run a focused
# subset with `--no-cov` when package-wide coverage is not meaningful.
addopts = "--cov=hmc_mcp --cov-report=term-missing --cov-fail-under=90"

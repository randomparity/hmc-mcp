repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: just lint
        language: system
        pass_filenames: false
      - id: ty
        name: ty type check
        entry: just typecheck
        language: system
        pass_filenames: false
      - id: detect-secrets
        name: Detect secrets
        entry: just secrets
        language: system
        pass_filenames: false
      - id: workflow-security
        name: Audit GitHub Actions
        entry: just workflow-security
        language: system
        pass_filenames: false
      - id: env-vars
        name: Env-var documentation guard
        entry: just env-vars
        language: system
        pass_filenames: false
      - id: nicknames
        name: Nicknames guard
        entry: just nicknames
        language: system
        pass_filenames: false

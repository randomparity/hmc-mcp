name: Pytest kernel memory evaluation
on:
  pull_request:
permissions:
  contents: read
jobs:
  memory:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/bounded-pytest-1434'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.11"
          version: "0.12.10"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: "1.58.0"
      - run: just setup
      - name: Observe one native production candidate after system-scope fitness
        shell: bash
        run: |
          observer=$(mktemp "$RUNNER_TEMP/q1434-peak-XXXXXX.py")
          cat > "$observer" <<'PYTHON'
          import hashlib
          import re
          import json
          import os
          import platform
          import runpy
          import subprocess
          import sys
          import time
          import uuid
          from pathlib import Path
          
          for override in runpy.run_path('scripts/run_tests.py')['_PYTEST_ENVIRONMENT_OVERRIDES']:
              os.environ.pop(override, None)
          ROOT = Path('/sys/fs/cgroup')
          OUT = Path(sys.argv[1]).resolve()
          OUT.mkdir(parents=True, exist_ok=True)
          RESULT = OUT / 'normalized.json'
          DATA = {'admitted': False, 'phase': 'preflight'}
          
          
          def run(args, **kwargs):
              return subprocess.run(args, text=True, capture_output=True, timeout=30, **kwargs)
          
          
          def dump(path, value):
              path.write_text(json.dumps(value, sort_keys=True, indent=2) + '\n')
          
          
          def resources():
              memberships = Path('/proc/self/cgroup').read_text().splitlines()
              assert len(memberships) == 1 and memberships[0].startswith('0::')
              group = (ROOT / memberships[0][3:].lstrip('/')).resolve()
              assert group.is_relative_to(ROOT)
              rows = []
              for ancestor in (group, *group.parents):
                  if not ancestor.is_relative_to(ROOT):
                      break
                  row = {'root': ancestor == ROOT}
                  for key in ('cpu.max', 'memory.max', 'memory.current', 'memory.swap.max'):
                      path = ancestor / key
                      row[key] = path.read_text().strip() if path.exists() else None
                  rows.append(row)
              memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
              return group, {'affinity': sorted(os.sched_getaffinity(0)), 'ancestors': rows,
                             'mem_available_kib': int(memory['MemAvailable'].split()[0]),
                             'mem_total_kib': int(memory['MemTotal'].split()[0])}
          
          
          def observe(mode, unit):
              launch = json.loads(sys.stdin.read())
              os.environ.clear()
              os.environ.update(launch['environment'])
              assert (os.getuid(), os.getgid(), sorted(os.getgroups())) == (
                  launch['uid'], launch['gid'], launch['groups'])
              group, identity = resources()
              assert group.name == unit
              result = {'mode': mode, 'resources': identity, 'runner_exit': None,
                        'owned_scope_verified': True, 'original_credentials_environment_restored': True,
                        'memory_initial': int((group / 'memory.current').read_text())}
              started = time.monotonic()
              try:
                  runner = runpy.run_path('scripts/run_tests.py')
                  result['resources_allow_parallel'] = runner['_resources_allow_parallel']()
                  previous = runner['_subreaper']()
                  with runner['_parallel_mode']() as selected:
                      result['selected_workers'] = 2 if selected else 1
                  result['subreaper_restored'] = runner['_subreaper']() == previous
                  assert result['resources_allow_parallel'] and result['selected_workers'] == 2
                  assert result['subreaper_restored']
                  if mode.startswith('probe'):
                      allocation = bytearray(64 * 1024**2)
                      for offset in range(0, len(allocation), 4096):
                          allocation[offset] = 1
                      if mode == 'probe-timeout':
                          child = subprocess.Popen([sys.executable, '-c',
                              'import signal,time; signal.signal(signal.SIGTERM,signal.SIG_IGN); time.sleep(60)'],
                              start_new_session=True)
                          result['child'] = child.pid
                          result['child_start'] = (Path('/proc') / str(child.pid) / 'stat').read_text().split()[21]
                          result['memory_peak'] = int((group / 'memory.peak').read_text())
                          dump(OUT / (mode + '.json'), result)
                          time.sleep(60)
                      with (OUT / 'fixture.log').open('w') as log:
                          command = subprocess.run([sys.executable, '-c',
                              'raise SystemExit(' + ('7' if mode == 'probe-failure' else '0') + ')'],
                              stdout=log, stderr=subprocess.STDOUT, timeout=10)
                  else:
                      with (OUT / 'runner.log').open('w') as log:
                          command = subprocess.run(['uv', 'run', '--no-sync', 'python', 'scripts/run_tests.py', '--timings'],
                                                   stdout=log, stderr=subprocess.STDOUT, timeout=1110)
                  result['runner_exit'] = command.returncode
              except BaseException as error:
                  result['failure_type'] = type(error).__name__
                  raise
              finally:
                  remaining = []
                  for path in group.rglob('cgroup.procs'):
                      for value in path.read_text().split():
                          pid = int(value)
                          if pid != os.getpid():
                              remaining.append(pid)
                  result['remaining_process_count'] = len(remaining)
                  result['execution_seconds'] = time.monotonic() - started
                  result['memory_peak'] = int((group / 'memory.peak').read_text())
                  result['memory_final'] = int((group / 'memory.current').read_text())
                  result['memory_events'] = (group / 'memory.events').read_text()
                  result['memory_stat'] = (group / 'memory.stat').read_text()
                  dump(OUT / (mode + '.json'), result)
              return command.returncode or int(bool(remaining))
          
          
          def execute_scope(manager, mode, affinity):
              unit = 'q1434-peak-' + uuid.uuid4().hex[:12] + '.scope'
              control = ['systemctl'] + manager
              command = ['systemd-run'] + manager + ['--scope', '--quiet', '--unit=' + unit,
                         '-p', 'MemoryAccounting=yes', '-p',
                         'RuntimeMaxSec=' + ('2s' if mode == 'probe-timeout' else '1140s' if mode == 'candidate' else '20s'),
                         '-p', 'TimeoutStopSec=3s']
              if not manager:
                  groups = ['--groups=' + ','.join(map(str, os.getgroups()))] if os.getgroups() else ['--clear-groups']
                  command = ['sudo', '-n', *command, 'setpriv', '--reuid=' + str(os.getuid()),
                             '--regid=' + str(os.getgid()), *groups]
                  control = ['sudo', '-n', *control]
              command += ['taskset', '--cpu-list', ','.join(map(str, affinity)), sys.executable,
                          str(Path(__file__).resolve()), str(OUT), mode, unit]
              record = OUT / (mode + '.json')
              record.unlink(missing_ok=True)
              outcome = None
              try:
                  launch = {'environment': dict(os.environ), 'uid': os.getuid(),
                            'gid': os.getgid(), 'groups': sorted(os.getgroups())}
                  outcome = subprocess.run(command, input=json.dumps(launch), capture_output=True,
                                           text=True, timeout=1170 if mode == 'candidate' else 50)
                  (OUT / (mode + '-scope.log')).write_text(outcome.stdout + outcome.stderr)
                  return outcome.returncode
              finally:
                  if mode == 'candidate':
                      DATA['candidate_scope_exit'] = outcome.returncode if outcome is not None else None
                      DATA['observation'] = json.loads(record.read_text()) if record.exists() else None
                      assert DATA['observation'] is None or DATA['observation']['mode'] == mode
                  state = run([*control, 'show', unit, '--property=LoadState', '--value'])
                  if state.stdout.strip() != 'not-found':
                      stop = run([*control, 'stop', unit])
                      assert stop.returncode == 0
                      state = run([*control, 'show', unit, '--property=LoadState', '--value'])
                      if state.stdout.strip() != 'not-found':
                          assert run([*control, 'reset-failed', unit]).returncode == 0
                  state = run([*control, 'show', unit, '--property=LoadState', '--value'])
                  DATA.setdefault('cleanup', []).append({'mode': mode, 'unit_absent': state.stdout.strip() == 'not-found'})
                  assert state.stdout.strip() == 'not-found'
          
          
          def main():
              group, original = resources()
              DATA.update(source=run(['git', 'rev-parse', 'HEAD'], check=True).stdout.strip(),
                          tree=run(['git', 'rev-parse', 'HEAD^{tree}'], check=True).stdout.strip(),
                          architecture=platform.machine(), kernel=platform.release(),
                          os=platform.freedesktop_os_release()['PRETTY_NAME'], python=platform.python_version(),
                          original_resources=original,
                          metric='kernel memory.peak: charged process, tmpfs and kernel memory; includes small observer')
              # A sibling scope is eligible only when no original finite quota/limit can be escaped.
              for row in original['ancestors']:
                  if not row['root']:
                      assert all(row[key] is not None for key in ('cpu.max', 'memory.max', 'memory.swap.max'))
                  assert row['cpu.max'] is None or row['cpu.max'].split()[0] == 'max'
                  assert row['memory.max'] in (None, 'max')
                  assert row['memory.swap.max'] in (None, 'max')
              manager = []  # Probe the existing system-manager path only.
              if not manager:
                  assert run(['sudo', '-n', 'systemctl', 'show', '--property=ControlGroup', '--value']).returncode == 0
              DATA['manager'] = 'user' if manager else 'system'
              for mode, status in [('probe-success', 0), ('probe-failure', 7), ('probe-timeout', None)]:
                  observed_status = execute_scope(manager, mode, original['affinity'])
                  record = OUT / (mode + '.json')
                  proof = json.loads(record.read_text()) if record.exists() else {}
                  DATA.setdefault('preflight', []).append({'mode': mode, 'exit': observed_status, **proof})
                  assert observed_status == status if status is not None else observed_status != 0
                  if mode != 'probe-timeout':
                      assert proof['runner_exit'] == status and proof['remaining_process_count'] == 0
                  assert proof['memory_peak'] >= 64 * 1024**2
                  assert proof['memory_peak'] > proof['memory_initial']
                  if mode == 'probe-timeout':
                      pid = proof.pop('child')
                      start = proof.pop('child_start')
                      stat = Path('/proc') / str(pid) / 'stat'
                      assert not stat.exists() or stat.read_text().split()[21] != start
                      proof['survivors'] = 0
                  DATA['preflight'][-1] = {'mode': mode, 'exit': observed_status, **proof}
              if os.environ.get('PEAK_PREFLIGHT_ONLY') == '1':
                  DATA['phase'] = 'preflight-complete'
                  return
              DATA['phase'] = 'collection'
              collection = subprocess.run(['uv', 'run', '--no-sync', 'pytest', '--collect-only', '-q', '--no-cov', 'tests/'],
                                          text=True, capture_output=True, timeout=120)
              (OUT / 'collection.log').write_text(collection.stdout + collection.stderr)
              assert collection.returncode == 0
              identities = sorted(line for line in collection.stdout.splitlines() if line.startswith('tests/') and '::' in line)
              assert identities and len(set(identities)) == len(identities)
              DATA['identities'] = [hashlib.sha256(value.encode()).hexdigest() for value in identities]
              DATA['collected'] = len(identities)
              DATA['phase'] = 'candidate'
              assert execute_scope(manager, 'candidate', original['affinity']) == 0
              observed = DATA['observation']['resources']
              assert observed['affinity'] == original['affinity']
              log = (OUT / 'runner.log').read_text()
              assert '; workers=2' in log
              assert re.search(r'\b' + str(len(identities)) + r' passed\b', log)
              assert not re.search(r'\d+ (?:failed|skipped|xfailed|xpassed|errors?)\b', log)
              DATA['selected_workers'] = 2
              DATA['all_collected_passed'] = True
              DATA['phase'] = 'coverage-export'
              coverage = run(['uv', 'run', '--no-sync', 'coverage', 'json', '-o', str(OUT / 'coverage.json')])
              assert coverage.returncode == 0
              report = json.loads((OUT / 'coverage.json').read_text())
              DATA['coverage_totals'] = report['totals']
              DATA['coverage_files'] = {hashlib.sha256(name.encode()).hexdigest(): item['summary']
                                        for name, item in report['files'].items()}
              DATA['admitted'] = True
              DATA['phase'] = 'complete'
          
          
          if len(sys.argv) == 4:
              raise SystemExit(observe(sys.argv[2], sys.argv[3]))
          try:
              main()
          except BaseException as error:
              DATA['failure_type'] = type(error).__name__
              raise
          finally:
              dump(RESULT, DATA)
          PYTHON
          uv run --no-sync python "$observer" "$RUNNER_TEMP/q1434-memory"
      - name: Retain normalized evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-memory-${{ matrix.architecture }}
          path: ${{ runner.temp }}/q1434-memory/normalized.json
          if-no-files-found: error
          retention-days: 7

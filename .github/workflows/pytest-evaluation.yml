name: Pytest evaluation
on: pull_request
permissions:
  contents: read
jobs:
  measure:
    if: github.head_ref == 'feat/bounded-pytest-1434' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.11'
          version: '0.12.10'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.58.0'
      - run: just setup
      - name: Measure complete suite
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pytest-evaluation"
          for mode in serial parallel parallel serial; do
            sample="$RUNNER_TEMP/pytest-evaluation/${mode}-${RANDOM}"
            args=()
            if [[ "$mode" == parallel ]]; then
              args=(-n 2 --dist=loadfile --max-worker-restart=0)
            fi
            uv run --no-sync python scripts/measure_parallel_pytest.py \
              --output "$sample" --timeout 1020 \
              .venv/bin/python -m pytest -q "${args[@]}" \
              --junitxml="$sample/junit.xml" --cov-report="json:$sample/coverage.json"
          done
      - name: Retain normalized evidence even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-evaluation-${{ matrix.runner }}
          path: ${{ runner.temp }}/pytest-evaluation/*/result.json
          if-no-files-found: error
          retention-days: 7

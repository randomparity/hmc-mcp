name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.architecture }} / Python ${{ matrix.python-version }} / verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.11"
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.12"
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.13"
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.14"
          - architecture: arm64
            runner: ubuntu-24.04-arm
            python-version: "3.11"
          - architecture: arm64
            runner: ubuntu-24.04-arm
            python-version: "3.12"
          - architecture: arm64
            runner: ubuntu-24.04-arm
            python-version: "3.13"
          - architecture: arm64
            runner: ubuntu-24.04-arm
            python-version: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.12.3"
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
        with:
          just-version: "1.58.0"
      - name: Set up development environment
        run: just setup
      # Named individually as well as reached through `static` -> `verify`, so a
      # stale docs/tools/ is reported as its own failed check rather than as one
      # line inside the umbrella recipe. See ADR 0097.
      - name: Check the generated tool reference
        run: just tool-docs-check
      # The generic half of the same pattern: every banner-carrying document is
      # regenerated and diffed, and the arrangement that generates it is checked
      # in both directions. See ADR 0098.
      - name: Check every generated document
        run: just doc-freshness
      - name: Run verification suite
        run: just verify
      - name: Retain validated wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-wheel-${{ matrix.architecture }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
      - name: Validate hooks
        run: UV_NO_SYNC=1 uv run prek run --all-files

  library-wheel-smoke:
    needs: ci
    name: amd64 / Python 3.13 / library wheel smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out library smoke harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.3"
      - name: Download validated wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-wheel-amd64-py3.13
          path: dist
      - name: Install bare validated wheel in a fresh environment
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )) || [[ ! -f "${wheels[0]:-}" ]]; then
            printf 'expected exactly one Python 3.13 wheel\n' >&2
            exit 1
          fi
          uv venv --python "3.13" .library-wheel-venv
          uv pip install --python .library-wheel-venv/bin/python \
            "${wheels[0]}"
      - name: Exercise the installed public API
        run: |
          .library-wheel-venv/bin/python - <<'PY'
          import asyncio
          from importlib.util import find_spec
          from pathlib import Path
          import sys

          from hmc_mcp.api import CapacitySummary, fetch_capacity_report

          package_path = Path(sys.modules["hmc_mcp"].__file__).resolve()
          environment = Path(".library-wheel-venv").resolve()
          assert package_path.is_relative_to(environment), package_path
          assert find_spec("fastmcp") is None
          assert find_spec("mcp") is None
          assert find_spec("rich") is None
          assert find_spec("typer") is None
          assert (package_path.parent / "py.typed").is_file(), package_path

          class FakeHMC:
              async def list_managed_systems(self):
                  return [{
                      "UUID": "system-1",
                      "Resource": {
                          "SystemName": "p10",
                          "AssignableSystemMemory": 32768,
                          "ConfigurableSystemProcessorUnits": 8.0,
                      },
                  }]

              async def list_logical_partitions(self, system_uuid):
                  assert system_uuid == "system-1"
                  return [{
                      "UUID": "lpar-1",
                      "Resource": {
                          "DesiredMemory": 8192,
                          "DesiredProcessingUnits": 2.0,
                          "PartitionState": "running",
                      },
                  }]

          report = asyncio.run(fetch_capacity_report(FakeHMC()))
          assert report == [CapacitySummary(
              system_uuid="system-1",
              system_name="p10",
              total_memory_mib=32768,
              assigned_memory_mib=8192,
              free_memory_mib=24576,
              total_proc_units=8.0,
              assigned_proc_units=2.0,
              free_proc_units=6.0,
              total_lpars=1,
              running_lpars=1,
          )]
          PY
      - name: Prove the marker makes the installed facade readable to a checker
        run: |
          cat > consumer_probe.py <<'PY'
          from hmc_mcp.api import LparCreation


          def probe(request: LparCreation) -> object:
              return request.field_that_does_not_exist
          PY
          # mypy is the checker that enforces PEP 561 as written: without a
          # readable py.typed it refuses the import outright ([import-untyped])
          # rather than reading the annotations anyway, which is what makes this
          # a real gate. The repo's own ty does read them regardless, so it
          # cannot tell a marked distribution from an unmarked one.
          #
          # Asserting "no diagnostics" would pass vacuously against an untyped
          # package, so assert the diagnostic that only a resolved type
          # produces, and reject the one that means the marker was not read.
          uv run --no-project --with "mypy==2.3.1" mypy \
            --python-executable .library-wheel-venv/bin/python \
            --no-incremental consumer_probe.py > probe.txt 2>&1 || true
          cat probe.txt
          if grep -q 'import-untyped' probe.txt; then
            printf 'installed distribution is missing a readable py.typed\n' >&2
            exit 1
          fi
          if ! grep -q 'attr-defined' probe.txt; then
            printf 'installed facade did not resolve as a typed package\n' >&2
            exit 1
          fi

  library-range-floors:
    needs: ci
    name: amd64 / Python 3.13 / library range floors
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.3"
      - name: Download validated wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-wheel-amd64-py3.13
          path: dist
      - name: Derive every declared range's floor from pyproject.toml
        run: |
          uv run --no-project python - <<'PY'
          import re
          import tomllib

          with open("pyproject.toml", "rb") as file:
              dependencies = tomllib.load(file)["project"]["dependencies"]

          requirement = re.compile(
              r"^(?P<name>[A-Za-z0-9][A-Za-z0-9._-]*)"
              r">=(?P<floor>[A-Za-z0-9][A-Za-z0-9.!+_-]*),"
              r"<(?P<cap>[A-Za-z0-9][A-Za-z0-9.!+_-]*)$"
          )
          with open(".range-floors.txt", "w") as out:
              for spec in dependencies:
                  match = requirement.fullmatch(spec)
                  if match is None:
                      raise SystemExit(
                          f"runtime dependency has no testable floor: {spec}"
                      )
                  out.write(f"{match['name']}=={match['floor']}\n")
          PY
          cat .range-floors.txt
      - name: Install the wheel with every runtime dependency at its floor
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )) || [[ ! -f "${wheels[0]:-}" ]]; then
            printf 'expected exactly one Python 3.13 wheel\n' >&2
            exit 1
          fi
          uv venv --python "3.13" .floor-venv
          uv pip install --python .floor-venv/bin/python \
            --requirements .range-floors.txt \
            "${wheels[0]}"
      - name: Exercise the installed public API on the floors
        run: |
          .floor-venv/bin/python - <<'PY'
          import asyncio
          from importlib.util import find_spec
          from pathlib import Path
          import sys

          from hmc_mcp.api import CapacitySummary, fetch_capacity_report

          package_path = Path(sys.modules["hmc_mcp"].__file__).resolve()
          environment = Path(".floor-venv").resolve()
          assert package_path.is_relative_to(environment), package_path
          assert find_spec("fastmcp") is None
          assert find_spec("mcp") is None
          assert find_spec("rich") is None
          assert find_spec("typer") is None

          class FakeHMC:
              async def list_managed_systems(self):
                  return [{
                      "UUID": "system-1",
                      "Resource": {
                          "SystemName": "p10",
                          "AssignableSystemMemory": 32768,
                          "ConfigurableSystemProcessorUnits": 8.0,
                      },
                  }]

              async def list_logical_partitions(self, system_uuid):
                  assert system_uuid == "system-1"
                  return [{
                      "UUID": "lpar-1",
                      "Resource": {
                          "DesiredMemory": 8192,
                          "DesiredProcessingUnits": 2.0,
                          "PartitionState": "running",
                      },
                  }]

          report = asyncio.run(fetch_capacity_report(FakeHMC()))
          assert report == [CapacitySummary(
              system_uuid="system-1",
              system_name="p10",
              total_memory_mib=32768,
              assigned_memory_mib=8192,
              free_memory_mib=24576,
              total_proc_units=8.0,
              assigned_proc_units=2.0,
              free_proc_units=6.0,
              total_lpars=1,
              running_lpars=1,
          )]
          PY

  wheel-smoke:
    needs: ci
    name: ${{ matrix.architecture }} / Python ${{ matrix.python-version }} / wheel smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.11"
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.12"
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.13"
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.14"
          - architecture: arm64
            runner: ubuntu-24.04-arm
            python-version: "3.11"
          - architecture: arm64
            runner: ubuntu-24.04-arm
            python-version: "3.12"
          - architecture: arm64
            runner: ubuntu-24.04-arm
            python-version: "3.13"
          - architecture: arm64
            runner: ubuntu-24.04-arm
            python-version: "3.14"
    steps:
      - name: Check out smoke harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.12.3"
      - name: Download validated wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-wheel-${{ matrix.architecture }}-py${{ matrix.python-version }}
          path: dist
      - name: Install bare validated wheel in a fresh environment
        env:
          MATRIX_ARCHITECTURE: ${{ matrix.architecture }}
          MATRIX_PYTHON: ${{ matrix.python-version }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )) || [[ ! -f "${wheels[0]:-}" ]]; then
            printf 'architecture=%s python=%s: expected exactly one wheel\n' \
              "${MATRIX_ARCHITECTURE}" "${MATRIX_PYTHON}" >&2
            exit 1
          fi
          uv venv --python "${MATRIX_PYTHON}" .wheel-venv
          uv export --frozen --no-dev --no-emit-project --no-header \
            --output-file .wheel-requirements.txt
          uv pip install --python .wheel-venv/bin/python \
            --requirements .wheel-requirements.txt
          uv pip install --no-deps --python .wheel-venv/bin/python "${wheels[0]}"
      - name: Exercise the supported library facade
        run: |
          .wheel-venv/bin/python - <<'PY'
          from importlib.util import find_spec
          from pathlib import Path

          import hmc_mcp
          from hmc_mcp.api import HMCClient

          package_path = Path(hmc_mcp.__file__).resolve()
          environment = Path(".wheel-venv").resolve()
          assert package_path.is_relative_to(environment), package_path
          assert HMCClient.__module__ == "hmc_mcp.client.core"
          for package in ("fastmcp", "mcp", "rich", "typer"):
              assert find_spec(package) is None, package
          PY
      - name: Install and exercise the app extra
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          uv export --frozen --extra app --no-dev --no-emit-project --no-header \
            --output-file .wheel-app-requirements.txt
          uv pip install --python .wheel-venv/bin/python \
            --requirements .wheel-app-requirements.txt
          uv pip install --no-deps --python .wheel-venv/bin/python \
            "${wheels[0]}[app]"
          .wheel-venv/bin/hmc-mcp --help >/dev/null
          # Renders every group's help page off the command tree the installed
          # wheel builds, so a new group needs no edit here. The script is
          # harness code, not package code: run this way sys.path[0] is
          # scripts/, never the checkout's src/, so hmc_mcp still resolves
          # inside .wheel-venv -- the same arrangement as smoke_mcp.py below.
          .wheel-venv/bin/python scripts/smoke_cli_groups.py
          .wheel-venv/bin/python scripts/smoke_mcp.py

